[workspace]
members = ["acpi-dump","cli", "qcparser"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"] }
fs-err = "3.2"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
tracing-subscriber = "0.3"

[package]
name = "tdx-measure"
version = "0.1.0"
authors = ["Your Name <your.email@example.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"
description = "A CLI tool for calculating TDX measurements"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde-human-bytes = "0.1"
hex = { workspace = true }
thiserror = "2.0"
sha2 = "0.10"
anyhow = { workspace = true }
object = "0.38"
hex-literal = "1.1"
fs-err = { workspace = true }
log = "0.4"
lzma-rs = "0.3"

[dev-dependencies]
serde_json = { workspace = true }
