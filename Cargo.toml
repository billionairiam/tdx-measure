[workspace]
members = ["cli"]
default-members = [".", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
fs-err = "3.2"
hex = "0.4"
serde_json = "1.0"

[package]
name = "tdx-measure"
authors = ["Your Name <your.email@example.com>"]
description = "A CLI tool for calculating TDX measurements"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
serde-human-bytes = "0.1"
hex.workspace = true
thiserror = "2.0"
sha2 = "0.10"
anyhow.workspace = true
object = "0.38"
hex-literal = "1.1"
fs-err.workspace = true
bon = "3.8"
log = "0.4"
tempfile = "3.27.0"

[dev-dependencies]
serde_json.workspace = true
